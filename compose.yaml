services:
  petstore:
    image: swaggerapi/petstore3:1.0.27
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/api/v3/openapi.json || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
